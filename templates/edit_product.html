<!DOCTYPE html>
<html>

<head>

    <title>ShopEase - Edit Product</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .container {
            width: 650px;
            background: #f8f5ff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 45px;
            font-weight: bold;
            color: #283f9f;
        }

        .tagline {
            margin-top: 5px;
            font-size: 13px;
            letter-spacing: 3px;
            color: #7650c7;
        }

        h1 {
            text-align: center;
            color: #4b3f72;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #4b3f72;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #c9c0e8;
            border-radius: 8px;
            background: white;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,.25);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
            transform: translateY(-1px);
        }

        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        .back-link a {
            color: #5b4bb7;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo-section">

        <div class="brand-name">ShopEase</div>

        <div class="tagline">
            Shop More • Worry Less
        </div>

    </div>

    <h1>✏️ Edit Product</h1>

    <form method="POST">

        <div class="form-group">

            <label>Product Name:</label>

            <input type="text"
                   name="name"
                   value="{{ product[1] }}"
                   required>

        </div>


        <div class="form-group">

            <label>Description:</label>

            <textarea name="description">{{ product[2] }}</textarea>

        </div>


        <div class="form-group">

            <label>Price:</label>

            <input type="number"
                   name="price"
                   step="0.01"
                   value="{{ product[3] }}"
                   required>

        </div>


        <div class="form-group">

            <label>Category:</label>

            <input type="text"
                   name="category"
                   value="{{ product[4] }}">

        </div>


        <div class="form-group">

            <label>Image URL:</label>

            <input type="text"
                   name="image_url"
                   value="{{ product[5] }}">

        </div>


        <div class="form-group">

            <label>Stock:</label>

            <input type="number"
                   name="stock"
                   min="0"
                   value="{{ product[6] }}"
                   required>

        </div>


        <button type="submit">
            Update Product
        </button>

    </form>


    <div class="back-link">

        <a href="/products">
            ← Back to Products
        </a>

    </div>

</div>

</body>

</html>
